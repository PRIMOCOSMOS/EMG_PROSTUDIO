[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "emg_prostudio"
version = "0.1.0"
description = "Professional EMG signal analysis studio for exercise monitoring"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "PRIMOCOSMOS"}
]
keywords = ["EMG", "signal processing", "exercise monitoring", "biomedical", "muscle activation", "fatigue analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "pywavelets>=1.1.1",
    "scikit-learn>=1.0.0",
    "PyQt5>=5.15.0",
    "pyqtgraph>=0.13.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "h5py>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]
dl = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/PRIMOCOSMOS/EMG_PROSTUDIO"
Repository = "https://github.com/PRIMOCOSMOS/EMG_PROSTUDIO"
Issues = "https://github.com/PRIMOCOSMOS/EMG_PROSTUDIO/issues"

[tool.setuptools]
packages = ["emg_prostudio"]

[tool.setuptools.package-data]
emg_prostudio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["emg_prostudio"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
